<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>ITN Mass Campaign 2028 | Mobile Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        /* Pure white background */
        body {
            background: #ffffff;
            font-family: -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Phone shape container */
        .phone-frame {
            width: 100%;
            max-width: 380px;
            margin: 0 auto;
            background-color: #e8e8ed;
            border-radius: 44px;
            box-shadow: 0 30px 45px -20px rgba(0,0,0,0.25), 0 0 0 6px #d4d4d8, 0 0 0 12px #1c1c1e;
            position: relative;
        }

        /* Phone screen */
        .phone-screen {
            background: #ffffff;
            border-radius: 40px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 700px;
            max-height: 80vh;
            position: relative;
            z-index: 5;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1);
        }

        /* Scrollable area */
        .screen-scroll {
            flex: 1;
            overflow-y: auto;
            background: #f8fafc;
            display: flex;
            flex-direction: column;
        }

        /* ----- LIGHT BLUE HEADER ----- */
        .app-header {
            background-color: #a3d0ff;
            padding: 1rem 1rem 1.2rem 1rem;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.5);
            flex-shrink: 0;
        }

        .project-title {
            font-size: 1.55rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            color: #0a2b44;
            margin: 0 0 0.75rem 0;
            line-height: 1.3;
        }

        /* Logo styling */
        .header-logo {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 0.25rem;
        }

        .header-logo img {
            max-width: 80px;
            height: auto;
            display: block;
        }

        /* ----- BODY with 6 cards in 2 columns (dashboard view) ----- */
        .dashboard-view {
            display: block;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        /* Individual card styling as clickable */
        .card {
            background: #ffffff;
            border-radius: 20px;
            padding: 1rem 0.75rem;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            transition: all 0.2s ease;
            cursor: pointer;
            border: 1px solid #eef2f8;
            display: block;
        }

        .card:active {
            transform: scale(0.96);
            background-color: #f5f9ff;
        }

        /* SVG icon container */
        .card-icon {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .card-icon svg {
            width: 48px;
            height: 48px;
            stroke-width: 1.7;
            stroke: #2c6e9e;
            fill: none;
        }

        .card-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: #1e4663;
            letter-spacing: -0.2px;
        }

        /* ----- IFRAME VIEW (hidden by default, shows when a card is clicked) ----- */
        .iframe-view {
            display: none;
            flex-direction: column;
            height: 100%;
            background: #ffffff;
        }

        .iframe-container {
            flex: 1;
            width: 100%;
            background: #ffffff;
        }

        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #ffffff;
        }

        /* Back button to return to dashboard */
        .back-button {
            background-color: #2c6e9e;
            color: white;
            border: none;
            padding: 0.7rem 1rem;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 30px;
            margin: 0.75rem 1rem;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .back-button:active {
            background-color: #1d5580;
            transform: scale(0.97);
        }

        .back-button svg {
            width: 18px;
            height: 18px;
            stroke: white;
            stroke-width: 2;
            fill: none;
        }

        /* ----- LIGHT BLUE FOOTER ----- */
        .app-footer {
            background-color: #a3d0ff;
            text-align: center;
            padding: 0.9rem 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.5);
            flex-shrink: 0;
            margin-top: auto;
        }

        .footer-text {
            font-size: 0.95rem;
            font-weight: 600;
            color: #0a2b44;
            letter-spacing: 0.5px;
        }

        /* Safe area support */
        @supports (padding: max(0px)) {
            .app-header {
                padding-top: max(1rem, env(safe-area-inset-top));
                padding-left: max(1rem, env(safe-area-inset-left));
                padding-right: max(1rem, env(safe-area-inset-right));
            }
            .app-footer {
                padding-bottom: max(0.9rem, env(safe-area-inset-bottom));
                padding-left: max(1rem, env(safe-area-inset-left));
                padding-right: max(1rem, env(safe-area-inset-right));
            }
            .dashboard-view {
                padding-left: max(1rem, env(safe-area-inset-left));
                padding-right: max(1rem, env(safe-area-inset-right));
            }
        }

        /* Landscape mode */
        @media (orientation: landscape) and (max-height: 550px) {
            .phone-screen {
                height: 85vh;
                max-height: 85vh;
            }
            .app-header {
                padding: 0.6rem 1rem 0.8rem 1rem;
            }
            .project-title {
                font-size: 1.2rem;
                margin-bottom: 0.5rem;
            }
            .header-logo img {
                max-width: 55px;
            }
            .card {
                padding: 0.7rem 0.5rem;
            }
            .card-icon svg {
                width: 36px;
                height: 36px;
            }
            .card-title {
                font-size: 0.75rem;
            }
            .cards-grid {
                gap: 0.75rem;
            }
            .app-footer {
                padding: 0.5rem 1rem;
            }
        }

        /* Small phones */
        @media (max-width: 400px) {
            .phone-frame {
                max-width: 100%;
                border-radius: 36px;
                box-shadow: 0 20px 35px -12px rgba(0,0,0,0.2), 0 0 0 5px #d4d4d8, 0 0 0 9px #1c1c1e;
            }
            .phone-screen {
                border-radius: 32px;
                height: 85vh;
            }
            .project-title {
                font-size: 1.45rem;
            }
            .card-title {
                font-size: 0.8rem;
            }
        }

        /* Scrollbar */
        .screen-scroll::-webkit-scrollbar {
            width: 3px;
        }
        .screen-scroll::-webkit-scrollbar-track {
            background: #e2e8f0;
        }
        .screen-scroll::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 10px;
        }
    </style>
</head>
<body>
<div class="phone-frame">
    <div class="phone-screen">
        <div class="screen-scroll" id="screenScroll">
            <!-- LIGHT BLUE HEADER (stays always visible) -->
            <header class="app-header">
                <h1 class="project-title">ITN Mass campaign 2028</h1>
                <div class="header-logo">
                    <img src="logo.png" alt="Logo" onerror="this.style.display='none'">
                </div>
            </header>

            <!-- DASHBOARD VIEW (cards grid) -->
            <div id="dashboardView" class="dashboard-view" style="padding: 1.25rem 1rem;">
                <div class="cards-grid">
                    <!-- 1. Registration Card -->
                    <div class="card" data-page="registration">
                        <div class="card-icon">
                            <svg viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                                <circle cx="12" cy="7" r="4" />
                                <path d="M17 3.5a4 4 0 0 1 0 7" />
                                <path d="M21 3.5a4 4 0 0 1 0 7" />
                            </svg>
                        </div>
                        <div class="card-title">Registration</div>
                    </div>

                    <!-- 2. Attendance Card -->
                    <div class="card" data-page="attendance">
                        <div class="card-icon">
                            <svg viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 8v4l3 3" />
                                <circle cx="12" cy="12" r="10" />
                                <path d="M12 2a10 10 0 1 0 10 10" />
                                <path d="M12 6v6l4 2" />
                            </svg>
                        </div>
                        <div class="card-title">Attendance</div>
                    </div>

                    <!-- 3. Distribution Card -->
                    <div class="card" data-page="distribution">
                        <div class="card-icon">
                            <svg viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M4 4h16v16H4z" />
                                <path d="M8 8h8v8H8z" />
                                <path d="M12 2v4" />
                                <path d="M12 18v4" />
                                <path d="M2 12h4" />
                                <path d="M18 12h4" />
                            </svg>
                        </div>
                        <div class="card-title">Distribution</div>
                    </div>

                    <!-- 4. Stock Card -->
                    <div class="card" data-page="stock">
                        <div class="card-icon">
                            <svg viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="2" y="7" width="20" height="14" rx="2" ry="2" />
                                <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16" />
                                <path d="M8 7v2" />
                                <path d="M16 7v2" />
                                <path d="M12 11v6" />
                            </svg>
                        </div>
                        <div class="card-title">Stock</div>
                    </div>

                    <!-- 5. Reconciliation Card -->
                    <div class="card" data-page="reconciliation">
                        <div class="card-icon">
                            <svg viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                                <polyline points="14 2 14 8 20 8" />
                                <line x1="16" y1="13" x2="8" y2="13" />
                                <line x1="16" y1="17" x2="8" y2="17" />
                                <polyline points="10 9 9 9 8 9" />
                            </svg>
                        </div>
                        <div class="card-title">Reconciliation</div>
                    </div>

                    <!-- 6. Waste Management Card -->
                    <div class="card" data-page="waste management">
                        <div class="card-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M3 6h18" />
                                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                                <line x1="10" y1="11" x2="10" y2="17" />
                                <line x1="14" y1="11" x2="14" y2="17" />
                            </svg>
                        </div>
                        <div class="card-title">Waste Management</div>
                    </div>
                </div>
            </div>

            <!-- IFRAME VIEW (hidden initially, shows when card is clicked) -->
            <div id="iframeView" class="iframe-view" style="display: none; flex: 1;">
                <div class="iframe-container" style="flex: 1; min-height: 400px;">
                    <iframe id="contentFrame" src="about:blank" title="Module Content"></iframe>
                </div>
                <button id="backToDashboardBtn" class="back-button">
                    <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 12H5M12 19l-7-7 7-7"/>
                    </svg>
                    Back to Dashboard
                </button>
            </div>

            <!-- LIGHT BLUE FOOTER -->
            <footer class="app-footer">
                <div class="footer-text">NMCP-MoH</div>
            </footer>
        </div>
    </div>
</div>

<script>
    // Get DOM elements
    const dashboardView = document.getElementById('dashboardView');
    const iframeView = document.getElementById('iframeView');
    const contentFrame = document.getElementById('contentFrame');
    const backButton = document.getElementById('backToDashboardBtn');
    const screenScroll = document.getElementById('screenScroll');

    // Map card data-page to HTML file names
    const pageToFile = {
        'registration': 'registration.html',
        'attendance': 'attendance.html',
        'distribution': 'distribution.html',
        'stock': 'stock.html',
        'reconciliation': 'reconciliation.html',
        'waste management': 'waste management.html'
    };

    // Function to load a page into iframe and show iframe view
    function loadPageInIframe(pageName) {
        const fileName = pageToFile[pageName];
        if (!fileName) {
            console.error('No file mapping for:', pageName);
            return;
        }
        
        // Set iframe source to the requested HTML file
        contentFrame.src = fileName;
        
        // Hide dashboard, show iframe view
        dashboardView.style.display = 'none';
        iframeView.style.display = 'flex';
        
        // Scroll to top of the container (so user sees the iframe from the top)
        if (screenScroll) {
            screenScroll.scrollTop = 0;
        }
    }

    // Function to return to dashboard
    function returnToDashboard() {
        // Hide iframe view, show dashboard
        iframeView.style.display = 'none';
        dashboardView.style.display = 'block';
        
        // Clear iframe source to stop any ongoing scripts/media
        contentFrame.src = 'about:blank';
        
        // Scroll to top (optional, keeps dashboard visible from top)
        if (screenScroll) {
            screenScroll.scrollTop = 0;
        }
    }

    // Attach click handlers to all cards
    const cards = document.querySelectorAll('.card');
    cards.forEach(card => {
        card.addEventListener('click', (e) => {
            // Prevent any default link behavior (cards are not <a> tags)
            e.preventDefault();
            const page = card.getAttribute('data-page');
            if (page) {
                loadPageInIframe(page);
            }
        });
        
        // Touch/click feedback (visual only)
        card.addEventListener('touchstart', function(e) {
            this.style.backgroundColor = '#f0f4fa';
        }, { passive: true });
        card.addEventListener('touchend', function(e) {
            this.style.backgroundColor = '#ffffff';
        });
        card.addEventListener('touchcancel', function(e) {
            this.style.backgroundColor = '#ffffff';
        });
        card.addEventListener('mousedown', function() {
            this.style.backgroundColor = '#f0f4fa';
        });
        card.addEventListener('mouseup', function() {
            this.style.backgroundColor = '#ffffff';
        });
        card.addEventListener('mouseleave', function() {
            this.style.backgroundColor = '#ffffff';
        });
    });

    // Back button event
    backButton.addEventListener('click', returnToDashboard);
    
    // Handle iframe load errors (optional: show fallback message inside iframe)
    contentFrame.addEventListener('error', function() {
        // If file doesn't exist, we could show a friendly message, but we keep silent
        console.warn('Iframe failed to load. Make sure the HTML file exists.');
    });
    
    // Ensure that dashboard is visible initially and iframe is hidden
    // (already set in CSS, but double-check)
    dashboardView.style.display = 'block';
    iframeView.style.display = 'none';
</script>
</body>
</html>
